[package]
name = "csrp-moderation-desktop"
version = "0.1.0"
description = "CSRP Moderation staff panel, as a desktop application"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
